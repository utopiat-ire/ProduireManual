      <script src="./js/html5shiv.js"></script>
      <script src="./js/respond.min.js"></script>
    <![endif]-->

  </head>

      <nav class="navbar navbar-inverse navbar-static-top m-0 p-0">
        <div class="container">
          <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar">
              <span class="sr-only"></span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
              <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="./">
              <span class="glyphicon glyphicon-search mr-2" aria-hidden="true"></span>プロデルマニュアル - 索引検索
            </a>
          </div>
          
          <div class="collapse navbar-collapse" id="navbar">
            <ul class="nav navbar-nav navbar-right">
              <li>
                <a href="../">
                  <span class="glyphicon glyphicon-home mr-2" aria-hidden="true"></span>ホーム
                </a>
              </li>
              <!--
              <li class="dropdown">
                <a class="dropdown-toggle" data-toggle="dropdown" href="#">
                  <span class="glyphicon glyphicon-new-window mr-2" aria-hidden="true"></span>リンク<span class="caret"></span>
                </a>
                <ul class="dropdown-menu">
                  <li><a href="">GitHubリポジトリ</a></li>
                  <li><a href="" target="_blank" rel="noopener noreferrer">制作者のブログ</a></li>
                </ul>
              </li>
              -->
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="border border-bottom py-2 bg-light">
        <div class="container">
          <div class="panel panel-default mt-3">
            <ul class="list-group list-group-flush panel-body py-0 small notice" id="notice">
            </ul>
          </div>
        </div>
      </section>

      <section class="py-4">
        <div class="container">
          <form method="get">
          <table class="search-form" cellpadding="5">
            <tr>
              <td class="w-15 py-2">
                <label for="freeWord" class="col-form-label">
                  キーワード
                  <a href="#" data-toggle="modal" data-target="#howToFreeWordsModal"><span class="glyphicon glyphicon-question-sign ml-1" aria-hidden="true"></span></a>
                  
                  <!-- モーダル・ダイアログ -->
                  </label><div class="modal fade in" id="howToFreeWordsModal" tabindex="-1">
                    <div class="modal-dialog">
                      <div class="modal-content">
                        <div class="modal-header">
                          <button type="button" class="close" data-dismiss="modal"><span>×</span></button>
                          <h4 class="h4">
                            <span class="glyphicon glyphicon-info-sign mr-1" aria-hidden="true"></span>キーワードを指定した検索方法
                          </h4>
                        </div>
                        <div class="modal-body mx-3">
                          <div class="my-1">複数のキーワードを指定して検索したい場合は、次のように<u>半角カンマ（,）やスペースで区切って入力してください。</u></div>
                          <div class="my-3">
                            <table cellpadding="5" style="table-layout: fixed; width: 100%;">
                              <tr>
                                <td style="width: 30%">
                                  <label for="sample_free_word" class="col-form-label">キーワード<a href="#"><i class="fas fa-question-circle ml-1"></i></a></label>
                                </td>
                                <td style="width: 70%;">
                                  <input type="text" class="form-control" id="sample_free_word" value="サンプル,さんぷる,sample" readonly>
                                </td>
                              </tr>
                            </table>
                          </div>
                          <div class="my-1">また、キーワード検索をする際に<u>「改行」や「スペース」を気にする必要はありません。</u></div>
                          <div class="my-1">検索対象から「改行」と「スペース」を削除した文字列に、指定されたキーワードが含まれているか否かで検索を行います。</div>        
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-default" data-dismiss="modal">閉じる</button>
                        </div>
                      </div>
                    </div>
                  </div>
                
              </td>
              <td class="w-75 py-2">
                <input type="text" class="form-control" name="query" id="freeWord" placeholder="検索したいキーワードを入力してください" />
              </td>
              <td class="w-10 py-2">
                <button type="submit" class="btn btn-secondary w-100" id="searchButton"><span class="glyphicon glyphicon-search mr-2" aria-hidden="true"></span>検索する</button>
              </td>
            </tr>
          </table>
        </form>
        <div class="text-center display-none" id="loadingStart">
            <div>検索中・・・</div>
          </div>
          <div class="text-center display-none" id="loadingEnd">
          </div>
          <div class="display-none mt-5" id="result">
            <table class="table table-bordered table-w-100">
              <thead class="resul-table-header">
                <tr>
                  <th class="w-30">タイトル</th>
                  <th class="w-70">タグ</th>
                </tr>
              </thead>
                <tbody id="resultTable">
                </tbody>
            </table>
          </div>
        </div>
        <div id="pageTop"><a href="#"></a></div>
      </section>
    </main>

    <footer class="border-top bg-light">
      <div class="container pt-4" style="padding-top: 2rem;">
        <div class="row py-1">
          <div class="col-12">
            <div class="text-center">
              <a href="../" class="text-secondary">
                <span class="glyphicon glyphicon-home mr-1" aria-hidden="true"></span>ホーム
              </a>

              |
              <span class="dropup">

                  <li><a href="" target="_blank" rel="noopener noreferrer">制作者のブログ</a></li>
                </ul>
              </span>
              -->
